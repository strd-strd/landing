# /etc/nginx/sites-available/invest
# proxy → PM2 investdemidov на 127.0.0.1:3005
#
# Первый раз (HTTP): этот файл как есть → certbot --nginx -d invest.demidovpark.ru
# Certbot сам добавит listen 443 ssl и редирект с :80.
# Если HTTPS уже есть, а с http:// всё ещё открывается без редиректа:
#   certbot enhance --redirect -d invest.demidovpark.ru

server {
    listen 80;
    listen [::]:80;
    server_name invest.demidovpark.ru;

    # После SSL этот блок обычно заменяет certbot на return 301 https://…
    # До certbot — прокси на приложение (чтобы сайт жил по HTTP).
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
